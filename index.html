<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>♡ 推しBLドラマ＆キャラ図鑑 ♡</title>
  <style>
    :root {
      --bg: #fff7fb;
      --bg-grad: radial-gradient(circle at top left, #ffeef6 0%, #f5efff 50%, #fffaf2 100%);
      --surface: #ffffff;
      --surface-soft: #fff0f7;
      --surface-lilac: #f4efff;
      --text: #2b1e38;
      --muted: #756585;
      --border: #f3d9e8;
      --accent: #ff6fa5;
      --accent-2: #8b5cf6;
      --accent-soft: #ffe4ef;
      --accent-ink: #ffffff;
      --star: #ffb703;
      --radius: 18px;
      --shadow: 0 8px 24px rgba(255, 111, 165, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Maru Gothic ProN", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      background: var(--bg);
      background-image: var(--bg-grad);
      color: var(--text);
      line-height: 1.65;
      min-height: 100vh;
    }

    .app {
      max-width: 1040px;
      margin: 0 auto;
      padding: 22px 16px 76px;
    }

    header {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      border: 1.5px solid var(--border);
      border-radius: 24px;
      padding: 18px 20px 14px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 18px;
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--text);
    }

    .testplay-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      border-top: 1px dashed var(--border);
      padding-top: 12px;
    }

    .tab-btn {
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, background-color 0.15s ease, border-color 0.15s ease;
    }

    .tab-btn:hover {
      transform: translateY(-1px);
      border-color: var(--accent);
    }

    .tab-btn.active {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
      color: var(--accent-ink);
      border-color: transparent;
      box-shadow: 0 4px 12px rgba(255, 111, 165, 0.28);
    }

    .card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 8px;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(185px, 1fr));
      gap: 10px;
      align-items: end;
    }

    .field-label {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 4px;
    }

    input[type="text"],
    input[type="search"],
    select,
    textarea {
      width: 100%;
      border: 1.5px solid var(--border);
      background: #fffcfe;
      color: var(--text);
      border-radius: 14px;
      padding: 9px 12px;
      font-size: 0.9rem;
      font-family: inherit;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(255, 111, 165, 0.15);
    }

    textarea {
      min-height: 76px;
      resize: vertical;
    }

    .chip-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .chip {
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 6px 13px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.12s ease;
    }

    .chip:hover {
      border-color: var(--accent);
    }

    .chip.active {
      background: var(--accent-soft);
      color: #d63373;
      border-color: var(--accent);
      font-weight: 800;
    }

    .meta-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }

    .item-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: transform 0.14s ease, border-color 0.14s ease;
    }

    .item-card:hover {
      transform: translateY(-2px);
      border-color: #f7b8d2;
    }

    .item-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .item-meta {
      font-size: 0.78rem;
      color: var(--muted);
      font-weight: 600;
    }

    .star-btn {
      border: none;
      background: var(--surface-soft);
      border-radius: 999px;
      width: 30px;
      height: 30px;
      font-size: 1.15rem;
      line-height: 1;
      cursor: pointer;
      color: #d5c5d8;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .star-btn.starred {
      color: var(--star);
      background: #fff6db;
    }

    .item-title {
      margin: 0;
      font-size: 1.03rem;
      font-weight: 800;
      color: var(--text);
    }

    .cast-line {
      font-size: 0.85rem;
      color: var(--accent-2);
      font-weight: 700;
      background: var(--surface-lilac);
      padding: 6px 10px;
      border-radius: 10px;
    }

    .desc {
      margin: 0;
      font-size: 0.87rem;
      color: var(--text);
    }

    .tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: auto;
      padding-top: 4px;
    }

    .tag {
      background: var(--surface-soft);
      color: #b82962;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
    }

    .btn {
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.12s ease;
    }

    .btn:hover {
      border-color: var(--accent);
      background: var(--surface-soft);
    }

    .btn.primary {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
      color: var(--accent-ink);
      border-color: transparent;
    }

    .btn.small {
      padding: 5px 11px;
      font-size: 0.78rem;
    }

    .quiz-q-card {
      padding: 14px 0;
      border-bottom: 1px dashed var(--border);
    }

    .quiz-q-card:last-of-type {
      border-bottom: none;
    }

    .quiz-q-title {
      font-weight: 800;
      margin-bottom: 8px;
      font-size: 0.95rem;
      color: var(--text);
    }

    .opt-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .opt-btn {
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 8px 13px;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
    }

    .opt-btn.selected {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
      color: var(--accent-ink);
      border-color: transparent;
      font-weight: 800;
    }

    .result-panel {
      background: var(--surface-soft);
      border: 1.5px solid #f7b8d2;
      border-radius: var(--radius);
      padding: 16px;
      margin-top: 14px;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #2b1e38;
      color: #ffffff;
      padding: 9px 18px;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 99;
    }

    .toast.show { opacity: 1; }

    .empty-box {
      text-align: center;
      padding: 32px 16px;
      color: var(--muted);
      background: var(--surface);
      border: 1.5px dashed var(--border);
      border-radius: var(--radius);
    }
  </style>
</head>

      { q: "Q12. 最後に、いま一番推したいのは？", options: [

        { label: "余韻を残すエモいキャラ", tag: "切なさ・エモ" },
        { label: "笑いをくれるコメディキャラ", tag: "コメディ・笑える" },
        { label: "大人で濃密な魅力のキャラ", tag: "大人・オフィス" }
      ]}
    ];

    const WORK_QUESTIONS = CHAR_QUESTIONS;

    const memStore = { favs: { dramas: [], mainChars: [], supporting: [] }, customWorks: [] };

    function loadFavs() {
      try {
        const raw = localStorage.getItem(STORAGE_FAV);
        if (raw) {
          const parsed = JSON.parse(raw);
          memStore.favs.dramas = Array.isArray(parsed.dramas) ? parsed.dramas : [];
          memStore.favs.mainChars = Array.isArray(parsed.mainChars) ? parsed.mainChars : [];
          memStore.favs.supporting = Array.isArray(parsed.supporting) ? parsed.supporting : [];
        }
      } catch (e) {}
    }

    function saveFavs() {
      try { localStorage.setItem(STORAGE_FAV, JSON.stringify(memStore.favs)); } catch (e) {}
    }

    function loadCustomWorks() {
      try {
        const raw = localStorage.getItem(STORAGE_CUSTOM_WORKS);
        if (raw) {
          const list = JSON.parse(raw);
          if (Array.isArray(list)) {
            memStore.customWorks = list;
            return list;
          }
        }
      } catch (e) {}
      return memStore.customWorks;
    }

    function saveCustomWorks(list) {
      memStore.customWorks = list;
      try { localStorage.setItem(STORAGE_CUSTOM_WORKS, JSON.stringify(list)); } catch (e) {}
    }

    function getAllDramas() {
      const base = RAW_BL_DRAMAS.map(([id, title, year, era, popularity, castArr, tags, platform, summary]) => ({
        id,
        title,
        year,
        era,
        popularity,
        cast: castArr.map(([name, group]) => ({ name, group })),
        tags,
        platform,
        summary,
        isCustom: false
      }));
      return [...loadCustomWorks(), ...base];
    }

    function formatCast(castList) {
      return (castList || [])
        .map(c => (c.group ? `${c.name}（${c.group}）` : c.name))
        .join(" × ");
    }

    function formatActor(actor) {
      return actor && actor.group ? `${actor.name}（${actor.group}）` : (actor ? actor.name : "");
    }

    function getAllSingleGroups() {
      const set = new Set();
      getAllDramas().forEach(d => {
        (d.cast || []).forEach(c => {
          if (c.group && !c.group.includes("/") && !c.group.includes("／")) {
            set.add(c.group);
          }
        });
      });
      MAIN_CHARACTERS.forEach(p => {
        if (p.actor && p.actor.group && !p.actor.group.includes("/") && !p.actor.group.includes("／")) {
          set.add(p.actor.group);
        }
      });
      SUPPORTING_CAST.forEach(p => {
        if (p.actor && p.actor.group && !p.actor.group.includes("/") && !p.actor.group.includes("／")) {
          set.add(p.actor.group);
        }
      });
      return [...set].sort((a, b) => a.localeCompare(b, "ja"));
    }

    function getSupportingSingleGroups() {
      const set = new Set();
      SUPPORTING_CAST.forEach(p => {
        if (p.actor && p.actor.group && !p.actor.group.includes("/") && !p.actor.group.includes("／")) {
          set.add(p.actor.group);
        }
      });
      return [...set].sort((a, b) => a.localeCompare(b, "ja"));
    }

    let state = {
      tab: "dramas",
      search: "",
      group: "",
      era: "",
      tag: "すべて",
      mainSearch: "",
      mainGroup: "",
      supSearch: "",
      supGroup: "",
      supRole: "すべて",
      charAnswers: {},
      charResultShown: false,
      workAnswers: {},
      workResultShown: false
    };

    function toggleFav(kind, id) {
      const arr = memStore.favs[kind];
      const idx = arr.indexOf(id);
      if (idx >= 0) {
        arr.splice(idx, 1);
        showToast("★推しリストから外しました");
      } else {
        arr.push(id);
        showToast("★推しリストに追加しました");
      }
      saveFavs();
      render();
    }

    function isFav(kind, id) {
      return memStore.favs[kind].includes(id);
    }

    function showToast(msg) {
      const el = document.getElementById("toast");
      if (!el) return;
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => el.classList.remove("show"), 2000);
    }

    function escapeHtml(s) {
      return String(s || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function jumpToDrama(dramaId) {
      state.tab = "dramas";
      state.search = "";
      state.group = "";
      state.era = "";
      state.tag = "すべて";
      updateNav();
      render();
      requestAnimationFrame(() => {
        const el = document.getElementById("drama-" + dramaId);
        if (el) {
          el.scrollIntoView({ behavior: "smooth", block: "center" });
          el.style.outline = "2px solid var(--accent)";
          setTimeout(() => { el.style.outline = ""; }, 1500);
        }
      });
    }

    function updateNav() {
      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.tab === state.tab);
      });
    }

    function matchesDramaFilter(d) {
      if (state.era && d.era !== state.era) return false;
      if (state.tag !== "すべて" && !(d.tags || []).includes(state.tag)) return false;
      if (state.group) {
        const hasGroup = (d.cast || []).some(c => c.group === state.group);
        if (!hasGroup) return false;
      }
      const kw = state.search.trim().toLowerCase();
      if (kw) {
        const hay = `${d.title} ${d.year} ${d.era} ${formatCast(d.cast)} ${d.summary} ${d.platform} ${(d.tags || []).join(" ")}`.toLowerCase();
        if (!hay.includes(kw)) return false;
      }
      return true;
    }

    function applyLiveDramaFilter() {
      const all = getAllDramas();
      let visibleCount = 0;
      all.forEach(d => {
        const card = document.getElementById("drama-" + d.id);
        if (!card) return;
        const ok = matchesDramaFilter(d);
        card.style.display = ok ? "" : "none";
        if (ok) visibleCount++;
      });
      const countEl = document.getElementById("dramaCountLabel");
      if (countEl) {
        countEl.textContent = `${visibleCount} / ${all.length} BL作品を表示中`;
      }
      const emptyEl = document.getElementById("dramaEmptyBox");
      if (emptyEl) {
        emptyEl.style.display = visibleCount === 0 ? "" : "none";
      }
    }

    function renderDramaCard(d) {
      const starred = isFav("dramas", d.id);
      const visible = matchesDramaFilter(d);
      return `
        <article class="item-card" id="drama-${escapeHtml(d.id)}" style="${visible ? "" : "display:none;"}">
          <div class="item-top">
            <div class="item-meta">${escapeHtml(d.year)}${d.isCustom ? " ・ 追加作品" : ""}</div>
            <button type="button" class="star-btn ${starred ? "starred" : ""}" onclick="toggleFav('dramas', '${escapeHtml(d.id)}')">★</button>
          </div>
          <h3 class="item-title">${escapeHtml(d.title)}</h3>
          <div class="cast-line">${escapeHtml(formatCast(d.cast))}</div>
          <p class="desc">${escapeHtml(d.summary)}</p>
          <div class="tags">
            ${(d.tags || []).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join("")}
          </div>
          <div class="item-meta">${escapeHtml(d.platform || "配信")}</div>
          ${d.isCustom ? `<button type="button" class="btn small" onclick="deleteCustomWork('${escapeHtml(d.id)}')">削除</button>` : ""}
        </article>
      `;
    }

    function renderMainCharCard(p) {
      const starred = isFav("mainChars", p.id);
      return `
        <article class="item-card" id="main-${escapeHtml(p.id)}">
          <div class="item-top">
            <div class="item-meta">メインキャラ ・ ${escapeHtml(p.archetype)}</div>
            <button type="button" class="star-btn ${starred ? "starred" : ""}" onclick="toggleFav('mainChars', '${escapeHtml(p.id)}')">★</button>
          </div>
          <h3 class="item-title">${escapeHtml(p.name)}</h3>
          <div class="cast-line">${escapeHtml(formatActor(p.actor))}</div>
          <p class="desc">${escapeHtml(p.description)}</p>
          <button type="button" class="btn small" onclick="jumpToDrama('${escapeHtml(p.dramaId)}')">作品：${escapeHtml(p.dramaTitle)} →</button>
        </article>
      `;
    }

    function renderSupportingCard(p) {
      const starred = isFav("supporting", p.id);
      return `
        <article class="item-card" id="sup-${escapeHtml(p.id)}">
          <div class="item-top">
            <div class="item-meta">${escapeHtml(p.roleCategory)} ・ ${escapeHtml(p.roleLabel)}</div>
            <button type="button" class="star-btn ${starred ? "starred" : ""}" onclick="toggleFav('supporting', '${escapeHtml(p.id)}')">★</button>
          </div>
          <h3 class="item-title">${escapeHtml(p.name)}</h3>
          <div class="cast-line">${escapeHtml(formatActor(p.actor))}</div>
          <p class="desc">${escapeHtml(p.description)}</p>
          <button type="button" class="btn small" onclick="jumpToDrama('${escapeHtml(p.dramaId)}')">作品：${escapeHtml(p.dramaTitle)} →</button>
        </article>
      `;
    }

    const DRAMA_TAGS = [
      "すべて", "学園・青春", "大人・オフィス", "同居・ルームシェア",
      "甘々・胸キュン", "切なさ・エモ", "コメディ・笑える", "グループ・仲間", "深夜枠"
    ];

    function renderDramasView() {
      const all = getAllDramas();
      const groups = getAllSingleGroups();
      const eras = ["2026年", "2025年", "2020〜2024年", "2019年以前"];
      const visibleCount = all.filter(matchesDramaFilter).length;

      return `
        <div class="card">
          <div class="controls">
            <div class="filter-grid">
              <div>
                <label class="field-label" for="dramaSearch">キーワード検索</label>
                <input id="dramaSearch" type="search" value="${escapeHtml(state.search)}" placeholder="作品名・キャスト・グループ・年" />
              </div>
              <div>
                <label class="field-label" for="dramaGroup">グループ名（単独）</label>
                <select id="dramaGroup">
                  <option value="">すべて</option>
                  ${groups.map(g => `<option value="${escapeHtml(g)}" ${state.group === g ? "selected" : ""}>${escapeHtml(g)}</option>`).join("")}
                </select>
              </div>
              <div>
                <label class="field-label" for="dramaEra">年代・年</label>
                <select id="dramaEra">
                  <option value="">すべて</option>
                  ${eras.map(e => `<option value="${escapeHtml(e)}" ${state.era === e ? "selected" : ""}>${escapeHtml(e)}</option>`).join("")}
                </select>
              </div>
              <div>
                <button type="button" class="btn" onclick="resetDramaFilters()">条件リセット</button>
              </div>
            </div>
            <div class="chip-row">
              ${DRAMA_TAGS.map(t => `<button type="button" class="chip ${state.tag === t ? "active" : ""}" onclick="state.tag = '${escapeHtml(t)}'; render();">${escapeHtml(t)}</button>`).join("")}
            </div>
          </div>
          <div class="meta-line">
            <span id="dramaCountLabel">${visibleCount} / ${all.length} BL作品を表示中</span>
          </div>
        </div>
        <div class="grid" id="dramaGrid">${all.map(renderDramaCard).join("")}</div>
        <div class="empty-box" id="dramaEmptyBox" style="${visibleCount === 0 ? "" : "display:none;"}">該当するBL作品がありません。</div>
      `;
    }

    function resetDramaFilters() {
      state.search = "";
      state.group = "";
      state.era = "";
      state.tag = "すべて";
      render();
    }

    function renderMainCharsView() {
      const groups = getAllSingleGroups();
      const kw = state.mainSearch.trim().toLowerCase();

      const filtered = MAIN_CHARACTERS.filter(p => {
        if (state.mainGroup && (!p.actor || p.actor.group !== state.mainGroup)) return false;
        if (kw) {
          const hay = `${p.name} ${formatActor(p.actor)} ${p.dramaTitle} ${p.archetype} ${p.description}`.toLowerCase();
          if (!hay.includes(kw)) return false;
        }
        return true;
      });

      return `
        <div class="card">
          <div class="controls">
            <div class="filter-grid">
              <div>
                <label class="field-label" for="mainSearch">メインキャラ検索</label>
                <input id="mainSearch" type="search" value="${escapeHtml(state.mainSearch)}" placeholder="キャラ名・キャスト・作品名" />
              </div>
              <div>
                <label class="field-label" for="mainGroup">グループ名（単独）</label>
                <select id="mainGroup">
                  <option value="">すべて</option>
                  ${groups.map(g => `<option value="${escapeHtml(g)}" ${state.mainGroup === g ? "selected" : ""}>${escapeHtml(g)}</option>`).join("")}
                </select>
              </div>
              <div>
                <button type="button" class="btn" onclick="state.mainSearch=''; state.mainGroup=''; render();">条件リセット</button>
              </div>
            </div>
          </div>
          <div class="meta-line">
            <span>${filtered.length} / ${MAIN_CHARACTERS.length} 人のメインキャラを表示中</span>
          </div>
        </div>
        ${filtered.length ? `<div class="grid">${filtered.map(renderMainCharCard).join("")}</div>` : `<div class="empty-box">該当するメインキャラが見つかりませんでした。</div>`}
      `;
    }

    const SUP_ROLES = [
      "すべて", "陽キャ・グループ", "親友枠", "同級生・クラスメイト",
      "先輩・同僚枠", "ライバル・キーパーソン", "兄・家族枠"
    ];

    function renderSupportingView() {
      const groups = getSupportingSingleGroups();
      const kw = state.supSearch.trim().toLowerCase();

      const filtered = SUPPORTING_CAST.filter(p => {
        if (state.supRole !== "すべて" && p.roleCategory !== state.supRole) return false;
        if (state.supGroup && (!p.actor || p.actor.group !== state.supGroup)) return false;
        if (kw) {
          const hay = `${p.name} ${formatActor(p.actor)} ${p.dramaTitle} ${p.roleCategory} ${p.roleLabel} ${p.description}`.toLowerCase();
          if (!hay.includes(kw)) return false;
        }
        return true;
      });

      return `
        <div class="card">
          <div class="controls">
            <div class="filter-grid">
              <div>
                <label class="field-label" for="supSearch">脇役検索</label>
                <input id="supSearch" type="search" value="${escapeHtml(state.supSearch)}" placeholder="脇役名・キャスト・作品名" />
              </div>
              <div>
                <label class="field-label" for="supGroup">グループ名（脇役収録のみ）</label>
                <select id="supGroup">
                  <option value="">すべて</option>
                  ${groups.map(g => `<option value="${escapeHtml(g)}" ${state.supGroup === g ? "selected" : ""}>${escapeHtml(g)}</option>`).join("")}
                </select>
              </div>
              <div>
                <button type="button" class="btn" onclick="state.supSearch=''; state.supGroup=''; state.supRole='すべて'; render();">条件リセット</button>
              </div>
            </div>
            <div class="chip-row">
              ${SUP_ROLES.map(r => `<button type="button" class="chip ${state.supRole === r ? "active" : ""}" onclick="state.supRole = '${escapeHtml(r)}'; render();">${escapeHtml(r)}</button>`).join("")}
            </div>
          </div>
          <div class="meta-line">
            <span>${filtered.length} / ${SUPPORTING_CAST.length} 人の脇役を表示中</span>
          </div>
        </div>
        ${filtered.length ? `<div class="grid">${filtered.map(renderSupportingCard).join("")}</div>` : `<div class="empty-box">該当する脇役が見つかりませんでした。</div>`}
      `;
    }

    function renderQuizSection(mode) {
      const isChar = mode === "char";
      const ansObj = isChar ? state.charAnswers : state.workAnswers;
      const shown = isChar ? state.charResultShown : state.workResultShown;
      const titleText = isChar ? "推しキャラ診断（全12問）" : "推し作品診断（全12問）";
      const btnText = isChar ? "推しキャラ結果を見る" : "推し作品結果を見る";

      const scores = {};
      CHAR_QUESTIONS.forEach((q, idx) => {
        const chosen = ansObj[idx];
        if (chosen !== undefined && q.options[chosen]) {
          const tag = q.options[chosen].tag;
          scores[tag] = (scores[tag] || 0) + 1;
        }
      });

      let resultHtml = "";
      if (shown) {
        if (isChar) {
          const pool = [
            ...MAIN_CHARACTERS.map(p => ({ ...p, _kind: "main" })),
            ...SUPPORTING_CAST.map(p => ({ ...p, _kind: "sup" }))
          ];
          const ranked = pool.map(p => {
            const drama = getAllDramas().find(d => d.id === p.dramaId);
            const tags = drama ? drama.tags : [];
            const score = tags.reduce((s, t) => s + (scores[t] || 0), 0);
            return { ...p, score };
          }).sort((a, b) => b.score - a.score).slice(0, 4);

          resultHtml = `
            <div class="result-panel">
              <h3 style="margin:0 0 10px;">あなたにおすすめの推しキャラ候補</h3>
              <div class="grid">${ranked.map(p => p._kind === "main" ? renderMainCharCard(p) : renderSupportingCard(p)).join("")}</div>
            </div>
          `;
        } else {
          const ranked = getAllDramas().map(d => {
            const score = (d.tags || []).reduce((s, t) => s + (scores[t] || 0), 0) + d.popularity * 0.05;
            return { ...d, score };
          }).sort((a, b) => b.score - a.score).slice(0, 4);

          resultHtml = `
            <div class="result-panel">
              <h3 style="margin:0 0 10px;">あなたにおすすめの推しBL作品候補</h3>
              <div class="grid">${ranked.map(renderDramaCard).join("")}</div>
            </div>
          `;
        }
      }

      return `
        <div class="card">
          <h2 style="margin:0 0 8px;">${titleText}</h2>
          ${CHAR_QUESTIONS.map((item, qIdx) => `
            <div class="quiz-q-card">
              <div class="quiz-q-title">${escapeHtml(item.q)}</div>
              <div class="opt-grid">
                ${item.options.map((opt, oIdx) => {
                  const sel = ansObj[qIdx] === oIdx;
                  return `<button type="button" class="opt-btn ${sel ? "selected" : ""}" onclick="pickQuizOption('${mode}', ${qIdx}, ${oIdx})">${escapeHtml(opt.label)}</button>`;
                }).join("")}
              </div>
            </div>
          `).join("")}
          <div style="margin-top:16px; display:flex; gap:10px; flex-wrap:wrap;">
            <button type="button" class="btn primary" onclick="submitQuiz('${mode}')">${btnText}</button>
            <button type="button" class="btn" onclick="clearQuiz('${mode}')">リセット</button>
          </div>
          ${resultHtml}
        </div>
      `;
    }

    function pickQuizOption(mode, qIdx, oIdx) {
      if (mode === "char") {
        state.charAnswers[qIdx] = oIdx;
      } else {
        state.workAnswers[qIdx] = oIdx;
      }
      render();
    }

    function submitQuiz(mode) {
      if (mode === "char") {
        state.charResultShown = true;
      } else {
        state.workResultShown = true;
      }
      render();
    }

    function clearQuiz(mode) {
      if (mode === "char") {
        state.charAnswers = {};
        state.charResultShown = false;
      } else {
        state.workAnswers = {};
        state.workResultShown = false;
      }
      render();
    }

    function renderAddWorkView() {
      const customList = loadCustomWorks();
      return `
        <div class="card">
          <h2 style="margin:0 0 10px;">BL作品を追加する</h2>
          <form onsubmit="handleAddWorkSubmit(event)" style="display:grid; gap:12px;">
            <div>
              <label class="field-label" for="newTitle">作品名 *</label>
              <input id="newTitle" type="text" required placeholder="例：〇〇の恋" />
            </div>
            <div class="filter-grid">
              <div>
                <label class="field-label" for="newYear">放送・公開時期</label>
                <input id="newYear" type="text" value="2026年秋" />
              </div>
              <div>
                <label class="field-label" for="newEra">年代区分</label>
                <select id="newEra">
                  <option value="2026年">2026年</option>
                  <option value="2025年">2025年</option>
                  <option value="2020〜2024年">2020〜2024年</option>
                  <option value="2019年以前">2019年以前</option>
                </select>
              </div>
              <div>
                <label class="field-label" for="newPlatform">放送・配信</label>
                <input id="newPlatform" type="text" value="配信" />
              </div>
            </div>
            <div class="filter-grid">
              <div>
                <label class="field-label" for="newCast1">キャスト1 *</label>
                <input id="newCast1" type="text" required placeholder="例：山田太郎" />
              </div>
              <div>
                <label class="field-label" for="newGroup1">グループ名1（単独・任意）</label>
                <input id="newGroup1" type="text" placeholder="例：M!LK" />
              </div>
              <div>
                <label class="field-label" for="newCast2">キャスト2</label>
                <input id="newCast2" type="text" placeholder="例：佐藤花男" />
              </div>
              <div>
                <label class="field-label" for="newGroup2">グループ名2（単独・任意）</label>
                <input id="newGroup2" type="text" placeholder="例：DXTEEN" />
              </div>
            </div>
            <div>
              <label class="field-label" for="newTags">タグ（カンマ区切り）</label>
              <input id="newTags" type="text" value="学園・青春, 甘々・胸キュン" />
            </div>
            <div>
              <label class="field-label" for="newSummary">あらすじ・見どころ</label>
              <textarea id="newSummary" placeholder="作品の概要を入力してください"></textarea>
            </div>
            <div>
              <button type="submit" class="btn primary">作品を追加して保存</button>
            </div>
          </form>
        </div>
        ${customList.length ? `
          <div class="card">
            <h3 style="margin:0 0 10px;">追加した作品（${customList.length}件）</h3>
            <div class="grid">${customList.map(renderDramaCard).join("")}</div>
          </div>
        ` : ""}
      `;
    }

    function handleAddWorkSubmit(e) {
      e.preventDefault();
      const title = document.getElementById("newTitle").value.trim();
      if (!title) return;
      const year = document.getElementById("newYear").value.trim() || "2026年";
      const era = document.getElementById("newEra").value;
      const platform = document.getElementById("newPlatform").value.trim() || "配信";
      const c1 = document.getElementById("newCast1").value.trim();
      const g1 = document.getElementById("newGroup1").value.trim();
      const c2 = document.getElementById("newCast2").value.trim();
      const g2 = document.getElementById("newGroup2").value.trim();
      const tags = document.getElementById("newTags").value.split(",").map(s => s.trim()).filter(Boolean);
      const summary = document.getElementById("newSummary").value.trim() || "ユーザー追加のBL作品。";

      const cast = [];
      if (c1) cast.push({ name: c1, group: g1 });
      if (c2) cast.push({ name: c2, group: g2 });

      const newEntry = {
        id: "custom-" + Date.now(),
        title,
        year,
        era,
        popularity: 95,
        cast,
        tags: tags.length ? tags : ["甘々・胸キュン"],
        platform,
        summary,
        isCustom: true
      };

      const next = [newEntry, ...loadCustomWorks()];
      saveCustomWorks(next);
      showToast("作品を追加しました");
      state.tab = "dramas";
      updateNav();
      render();
    }

    function deleteCustomWork(id) {
      const next = loadCustomWorks().filter(w => w.id !== id);
      saveCustomWorks(next);
      showToast("追加作品を削除しました");
      render();
    }

    function renderFavoritesView() {
      const favDramas = getAllDramas().filter(d => isFav("dramas", d.id));
      const favMain = MAIN_CHARACTERS.filter(p => isFav("mainChars", p.id));
      const favSup = SUPPORTING_CAST.filter(p => isFav("supporting", p.id));
      return `
        <div class="card">
          <h2 style="margin:0 0 12px;">★推しリスト</h2>
          <h3 style="margin:12px 0 8px;">推し作品（${favDramas.length}件）</h3>
          ${favDramas.length ? `<div class="grid">${favDramas.map(renderDramaCard).join("")}</div>` : `<p class="desc" style="color:var(--muted);">まだ推し作品がありません。</p>`}
          <h3 style="margin:18px 0 8px;">推しメインキャラ（${favMain.length}人）</h3>
          ${favMain.length ? `<div class="grid">${favMain.map(renderMainCharCard).join("")}</div>` : `<p class="desc" style="color:var(--muted);">まだ推しメインキャラがありません。</p>`}
          <h3 style="margin:18px 0 8px;">推し脇役（${favSup.length}人）</h3>
          ${favSup.length ? `<div class="grid">${favSup.map(renderSupportingCard).join("")}</div>` : `<p class="desc" style="color:var(--muted);">まだ推し脇役がありません。</p>`}
        </div>
      `;
    }

    function replayCurrentMode() {
      if (state.tab === "char-quiz") {
        clearQuiz("char");
        showToast("推しキャラ診断を最初からやり直せます");
      } else if (state.tab === "work-quiz") {
        clearQuiz("work");
        showToast("推し作品診断を最初からやり直せます");
      } else {
        resetDramaFilters();
        state.mainSearch = "";
        state.mainGroup = "";
        state.supSearch = "";
        state.supGroup = "";
        state.supRole = "すべて";
        render();
        showToast("検索・表示をリセットして最初からプレイできます");
      }
    }

    function runAutoTestPlay() {
      const dramaCount = getAllDramas().length;
      const mainCount = MAIN_CHARACTERS.length;
      const supCount = SUPPORTING_CAST.length;
      const supGroups = getSupportingSingleGroups();
      state.tab = "main-chars";
      updateNav();
      render();
      showToast(`テスト完了: ${dramaCount}作品・メイン${mainCount}人・脇役${supCount}人（脇役グループ${supGroups.length}件）`);
    }

    function render() {
      const container = document.getElementById("viewContainer");
      if (!container) return;
      if (state.tab === "dramas") container.innerHTML = renderDramasView();
      else if (state.tab === "main-chars") container.innerHTML = renderMainCharsView();
      else if (state.tab === "supporting") container.innerHTML = renderSupportingView();
      else if (state.tab === "char-quiz") container.innerHTML = renderQuizSection("char");
      else if (state.tab === "work-quiz") container.innerHTML = renderQuizSection("work");
      else if (state.tab === "add-work") container.innerHTML = renderAddWorkView();
      else if (state.tab === "favorites") container.innerHTML = renderFavoritesView();
    }

    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        state.tab = btn.dataset.tab;
        updateNav();
        render();
      });
    });

    const viewContainerEl = document.getElementById("viewContainer");
    if (viewContainerEl) {
      viewContainerEl.addEventListener("change", (e) => {
        const target = e.target;
        if (!target) return;
        if (target.id === "dramaGroup") {
          state.group = target.value;
          applyLiveDramaFilter();
        } else if (target.id === "dramaEra") {
          state.era = target.value;
          applyLiveDramaFilter();
        } else if (target.id === "mainGroup") {
          state.mainGroup = target.value;
          render();
        } else if (target.id === "supGroup") {
          state.supGroup = target.value;
          render();
        }
      });

      viewContainerEl.addEventListener("input", (e) => {
        const target = e.target;
        if (!target) return;
        if (target.id === "dramaSearch") {
          state.search = target.value;
          applyLiveDramaFilter();
        } else if (target.id === "mainSearch") {
          state.mainSearch = target.value;
          render();
        } else if (target.id === "supSearch") {
          state.supSearch = target.value;
          render();
        }
      });
    }

    // キーワード検索をIME入力・通常入力どちらでも確実に反映
    document.addEventListener("compositionend", (e) => {
      const target = e.target;
      if (!target) return;
      if (target.id === "dramaSearch") {
        state.search = target.value;
        applyLiveDramaFilter();
      } else if (target.id === "mainSearch") {
        state.mainSearch = target.value;
        render();
      } else if (target.id === "supSearch") {
        state.supSearch = target.value;
        render();
      }
    });

    loadFavs();
    updateNav();
    render();
  </script>
</body>
</html>
